# ติดตั้ง k3s cluster (master + workers) และดึง kubeconfig มาที่เครื่องคุม
# รัน: ansible-playbook -i ansible/inventory.ini ansible/site.yml
# รันซ้ำกี่รอบก็ได้ (idempotent): รอบที่ 2 เป็นต้นไปต้องได้ changed=0
- hosts: all
  become: true
  tasks:
    - name: ติดตั้งแพ็กเกจพื้นฐาน
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        update_cache: true

- hosts: master
  become: true
  tasks:
    - name: ติดตั้ง k3s server (ใช้ Traefik ที่มากับ k3s เป็น Gateway)
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --node-ip {{ ansible_host }} --advertise-address {{ ansible_host }} --tls-san {{ ansible_host }} --flannel-iface enp0s8
      args:
        creates: /usr/local/bin/k3s

    - name: อ่าน token สำหรับ worker
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    # ดึงไฟล์ดิบ (127.0.0.1) มาเก็บไว้เฉย ๆ ไม่แก้ไข จึงไม่ถูกเขียนทับซ้ำ
    - name: ดึง kubeconfig ดิบมาที่เครื่องคุม
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig.raw"
        flat: true

- hosts: workers
  become: true
  tasks:
    - name: ติดตั้ง k3s agent
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ hostvars['k8s-master'].ansible_host }}:6443
        K3S_TOKEN={{ hostvars['k8s-master'].node_token.content | b64decode | trim }} sh -s - --node-ip {{ ansible_host }} --flannel-iface enp0s8
      args:
        creates: /etc/systemd/system/k3s-agent.service

- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # สร้าง kubeconfig ที่ชี้ IP จริงของ master จากไฟล์ดิบ (copy เทียบ checksum จึงไม่ changed ถ้าเหมือนเดิม)
    - name: สร้าง kubeconfig ที่ชี้ไปที่ IP จริงของ master
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/kubeconfig.raw') | regex_replace('127\\.0\\.0\\.1', hostvars['k8s-master'].ansible_host) }}\n"
        dest: "{{ playbook_dir }}/kubeconfig"
        mode: "0600"
