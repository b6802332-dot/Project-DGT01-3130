services:
  postgres-svc:
    image: postgres:16
    environment:
      POSTGRES_DB: sisdb
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: sis_dev_pw
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sis -d sisdb"]
      interval: 5s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      DB_HOST: postgres-svc
      DB_PORT: "5432"
      DB_NAME: sisdb
      DB_USER: sis
      DB_PASSWORD: sis_dev_pw
      SEMESTER: "1/2569"
    depends_on:
      postgres-svc:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports: ["8080:80"]
    depends_on: [backend]
